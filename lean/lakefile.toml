name = "Bohr59a"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Bohr59a"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib c55e6e786f49 (lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Bohr59a"
roots = ["Bohr59a"]
globs = ["Bohr59a.+"]

# The certificate checker (core Lean only), compiled to native code for the `native_decide` shard checks.
[[lean_lib]]
name = "Bohr59aCore"
precompileModules = true

# Generated certificate data (tools/export59.py; base64 string literals, no imports), the shard checks (native_decide;
# tools/gen_checks.py) and the decoding cross-checks against the exporter (also written by tools/gen_checks.py; not
# needed for the proof).
[[lean_lib]]
name = "Bohr59aData"
globs = ["Bohr59aData.+"]

[[lean_lib]]
name = "Bohr59aCheck"
globs = ["Bohr59aCheck.+"]

[[lean_lib]]
name = "Bohr59aTest"
globs = ["Bohr59aTest.+"]

# Ball arithmetic (C64Core/Ival.lean, core Lean, precompiled) and its soundness (C64/Ival/Sound.lean,
# C64/Ival/SoundTrig.lean).
[[lean_lib]]
name = "C64Core"
roots = ["C64Core.Ival"]
precompileModules = true

[[lean_lib]]
name = "C64"
roots = ["C64.Ival.Sound", "C64.Ival.SoundTrig"]

# The N theorem from the 49 shard checks (tools/gen_final_n.py; built where the check modules are built).
[[lean_lib]]
name = "Bohr59aN"
globs = ["Bohr59aN.+"]

# The k = 7 N theorem from the 576 half-domain shard checks (tools/gen_final_n7.py).
[[lean_lib]]
name = "Bohr59aN7"
globs = ["Bohr59aN7.+"]
